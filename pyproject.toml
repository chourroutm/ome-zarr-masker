[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ome-zarr-masker"
version = "0.0.1"
description = "Mask organs in OME-Zarr v0.5 volumes with SAM2."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "zarr>=3",
    "ome-zarr-models>=1.6",
    "scipy",
]

[project.optional-dependencies]
sam2 = ["torch", "sam2"]
interactive = ["napari"]
s3 = ["fsspec", "s3fs"]
gcs = ["fsspec", "gcsfs"]
azure = ["fsspec", "adlfs"]
http = ["fsspec", "aiohttp"]
remote = ["ome-zarr-masker[s3,gcs,azure,http]"]
dev = ["pytest", "ruff", "moto[server]"]

[project.scripts]
ome-zarr-masker = "ome_zarr_masker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ome_zarr_masker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_backend: tests that require an installed SAM backend and/or GPU (skipped by default)",
    "slow: longer-running tests",
    "remote_live: tests against real cloud buckets, run only when OME_ZARR_MASKER_TEST_{S3,GCS,AZURE}_URL is set",
]
